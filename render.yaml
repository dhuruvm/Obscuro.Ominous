services:
  - type: web
    name: obscuro-ominous
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "streamlit run StreamLit/app.py --server.address 0.0.0.0 --server.port ${PORT:-10000} --server.headless true"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: "10000"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
